name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: checkbot-rag
            dockerfile: ./Dockerfile
          - image: checkbot-rag-migrations
            dockerfile: ./Dockerfile.migrations

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get commit hash
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/faktenforum/${{ matrix.image }}
          # Tag conventions match faktenforum/faktenforum (see deploy-dev.yml + release.yml):
          # - main push        -> <short-commit-hash> + latest-dev
          # - release tag (v*) -> <version> (vX.Y.Z) + latest
          # - workflow_dispatch on main -> <short-commit-hash> + latest-dev
          tags: |
            type=raw,value=${{ env.COMMIT_HASH }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest-dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          platforms: linux/amd64
