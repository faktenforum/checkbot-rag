# Standalone run (no Traefik). Used for local development and testing.
# Copy .env.example to .env and set SEARCH_EMBEDDING_API_KEY and SEARCH_EMBEDDING_BASE_URL, then:
#   docker compose up --build
# Admin UI: http://localhost:3020

services:
  search-db:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    restart: always
    environment:
      POSTGRES_DB: ${SEARCH_POSTGRES_DB:-search}
      POSTGRES_USER: ${SEARCH_POSTGRES_USER:-search}
      POSTGRES_PASSWORD: ${SEARCH_POSTGRES_PASSWORD:-mypassword}
    volumes:
      - search_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SEARCH_POSTGRES_USER:-search} -d ${SEARCH_POSTGRES_DB:-search}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - search-net

  search-dbmate:
    image: ghcr.io/amacneil/dbmate:latest
    environment:
      DATABASE_URL: "postgres://${SEARCH_POSTGRES_USER:-search}:${SEARCH_POSTGRES_PASSWORD:-mypassword}@search-db:5432/${SEARCH_POSTGRES_DB:-search}?sslmode=disable"
      DBMATE_MIGRATIONS_TABLE: search_schema_migrations
      DBMATE_NO_DUMP_SCHEMA: "1"
      DBMATE_WAIT: "1"
    volumes:
      - ./core/db:/db
    depends_on:
      search-db:
        condition: service_healthy
    command: ["up"]
    networks:
      - search-net

  search:
    build: .
    restart: always
    ports:
      - "${SEARCH_PORT:-3020}:3020"
    environment:
      SEARCH_PORT: ${SEARCH_PORT:-3020}
      PORT: ${SEARCH_PORT:-3020}
      HOST: "0.0.0.0"
      SEARCH_POSTGRES_HOST: search-db
      SEARCH_POSTGRES_PORT: "5432"
      SEARCH_POSTGRES_DB: ${SEARCH_POSTGRES_DB:-search}
      SEARCH_POSTGRES_USER: ${SEARCH_POSTGRES_USER:-search}
      SEARCH_POSTGRES_PASSWORD: ${SEARCH_POSTGRES_PASSWORD:-mypassword}
      SEARCH_EMBEDDING_PROVIDER: ${SEARCH_EMBEDDING_PROVIDER:-scaleway}
      SEARCH_EMBEDDING_MODEL: ${SEARCH_EMBEDDING_MODEL:-qwen3-embedding-8b}
      SEARCH_EMBEDDING_API_KEY: ${SEARCH_EMBEDDING_API_KEY:-}
      SEARCH_EMBEDDING_BASE_URL: ${SEARCH_EMBEDDING_BASE_URL:-https://api.scaleway.ai/v1}
      SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-1536}
      SEARCH_EMBEDDING_BATCH_SIZE: ${SEARCH_EMBEDDING_BATCH_SIZE:-32}
      SEARCH_WEIGHT_VEC: ${SEARCH_WEIGHT_VEC:-1.0}
      SEARCH_WEIGHT_FTS: ${SEARCH_WEIGHT_FTS:-0.5}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-60}
      SEARCH_OVERFETCH: ${SEARCH_OVERFETCH:-3}
      SEARCH_MAX_CHUNK_CHARS: ${SEARCH_MAX_CHUNK_CHARS:-6000}
      SEARCH_SESSION_SECRET: ${SEARCH_SESSION_SECRET:-dev-insecure-session-secret-change-me-please!!}
      SEARCH_BOOTSTRAP_ADMIN_EMAIL: ${SEARCH_BOOTSTRAP_ADMIN_EMAIL:-}
      SEARCH_BOOTSTRAP_ADMIN_PASSWORD: ${SEARCH_BOOTSTRAP_ADMIN_PASSWORD:-}
      SEARCH_BOOTSTRAP_FAKTENFORUM_KEY: ${SEARCH_BOOTSTRAP_FAKTENFORUM_KEY:-}
      SEARCH_BOOTSTRAP_MCP_KEY: ${SEARCH_BOOTSTRAP_MCP_KEY:-}
      SEARCH_RATE_LIMIT_ENABLED: ${SEARCH_RATE_LIMIT_ENABLED:-true}
      NODE_ENV: production
    volumes:
      - ./exports:/data/exports
    depends_on:
      search-db:
        condition: service_healthy
      search-dbmate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${SEARCH_PORT:-3020}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - search-net

volumes:
  search_pgdata:

networks:
  search-net:
    driver: bridge
